name: Build JCOW414 OpenWrt Firmware

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune -a -f || true
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            bzip2 \
            ccache

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Firmware
        run: |
          cp jcow414.defconfig .config
          make defconfig

      - name: Download Sources
        run: |
          make download -j8 || make download -j1 V=s

      - name: Compile OpenWrt
        run: |
          echo "Building on $(nproc) cores..."
          make -j$(nproc) || make -j1 V=s

      - name: Prepare Artifacts
        id: organize
        run: |
          mkdir -p release_bin
          cp $(find bin/targets/ -type f -name "*jcow414*") release_bin/ 2>/dev/null || true
          cp $(find bin/targets/ -type f -name "sha256sums") release_bin/ 2>/dev/null || true
          cp .config release_bin/config.buildinfo
          cd release_bin
          ls -lh
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-jcow414-nokia-alcl
          path: release_bin/*
          if-no-files-found: error
